# 本 fork 的 CI：验证「构建 + 静态检查 + 核心包测试 + 配置合法性」。
# 说明：上游原工作流包含 SSH agent / 全量集成测试等重环节，
# 本扩展版裁剪为轻量门禁，保证每次 push 后仓库首页状态可信。
name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./loadtest/... ./cmd/... ./performance/...

      - name: gofmt check
        run: test -z "$(gofmt -l loadtest cmd performance | tee /dev/stderr)"

      - name: go test (loadtest)
        run: go test -count=1 -timeout 600s ./loadtest/...

      - name: validate json configs
        run: |
          set -e
          for f in config/*.sample.json config/formal/*.json; do
            python3 -c "import json; json.load(open('$f'))" || { echo "INVALID JSON: $f"; exit 1; }
          done
          echo "all json configs valid"
